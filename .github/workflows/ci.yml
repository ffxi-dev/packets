name: ci

on:
  push:
    branches: [main]
  pull_request:

# lsb's runners while the repository is private. They refuse public ones, which GitHub runs for free.
jobs:
  js:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","lsb"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run lint && npm run format:check && npm test
      # types/ is written by npm run types from the code's JSDoc; a change to the code must come with them.
      - run: npm run types && git add -N types && git diff --exit-code -- types

  python:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","lsb"]') || 'ubuntu-latest' }}
    # lsb's runner keeps a home directory; packages there must not leak into the job.
    env:
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with: { version: '0.13.7', python-version: '3.13' }
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest -q
